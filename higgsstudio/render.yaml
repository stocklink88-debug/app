services:
  - type: web
    name: higgsstudio
    runtime: docker
    plan: standard          # el motor de vídeo necesita CPU y disco
    healthCheckPath: /api/health
    disk:
      name: higgs-data
      mountPath: /data
      sizeGB: 20
    envVars:
      - key: HIGGSSTUDIO_DATA_DIR
        value: /data
      - key: ALLOW_SIGNUP
        value: "false"      # ciérralo al publicar; usa INVITE_CODE si lo abres
      - key: BOOTSTRAP_EMAIL
        sync: false
      - key: BOOTSTRAP_PASSWORD
        sync: false
      - key: FAL_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
